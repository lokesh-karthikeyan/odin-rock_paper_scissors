<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>TOP | Rock Paper Scissors</title>
  <link href="css/style.css" rel="stylesheet" type="text/css">
  <script defer src="js/script.js" type="text/javascript"></script>
</head>

<body>
  <!-- *** Header content of the page *** -->

  <header class="header-title">
    <h1>Rock Paper Scissors</h1>
    <img src="images/rock-paper-scissors.png" alt="A logo of hand signs that shows 'Rock', 'Paper' and 'Scissors'."
      height="80" width="80">
  </header>

  <main class="main-content">
    <div>
      <img src=" images/human.png" alt="An icon of a human" height="220" width="220" class="player-logo">
    </div>
    <!-- *** The container that displays and keep tracks of the scores *** -->

    <section class="scorecards">
      <h2>Score</h2>
      <div class="scores-individual">
        <!-- *** Container of the player's scoreboard *** -->

        <section class="player-score">
          <h3>Player</h3>
          <div class="current-score">
            <p id="player-point">0</p>
          </div>
        </section>
        <!-- *** Container of the computer's scoreboard *** -->

        <section class="computer-score">
          <h3>Computer</h3>
          <div class="current-score">
            <p id="computer-point">0</p>
          </div>
        </section>
      </div>
    </section>
    <div>
      <img src="images/robot.png" alt="An icon of a robot" height="220" width="220" class="computer-logo">
    </div>
  </main>

  <div class="container">
    <div class="player-container">
      <div class="signs-container">
        <!-- *** Contains the options where the player can hover and select *** -->

        <section class="signs signs-player" id="player-rock">
          <h4>Rock</h4>
          <div class="choice">
            <button><img src="images/rock.png" alt="An image of a rock" height="150" width="150"></button>
          </div>
        </section>
        <section class="signs signs-player" id="player-paper">
          <h4>Paper</h4>
          <div class="choice">
            <button><img src="images/paper.png" alt="An image of a paper" height="150" width="150"></button>
          </div>
        </section>
        <section class="signs signs-player" id="player-scissors">
          <h4>Scissors</h4>
          <div class="choice">
            <button><img src="images/scissors.png" alt="An image of a scissors" height="150" width="150"></button>
          </div>
        </section>
      </div>
    </div>
    <div class="computer-container">
      <div class="signs-container">
        <!-- *** Contains the options where the "javascript" code selects the option by random *** -->

        <section class="signs" id="computer-rock">
          <h4>Rock</h4>
          <div class="choice">
            <button><img src="images/rock.png" alt="An image of a rock" height="150" width="150"></button>
          </div>
        </section>
        <section class="signs" id="computer-paper">
          <h4>Paper</h4>
          <div class="choice">
            <button><img src="images/paper.png" alt="An image of a paper" height="150" width="150"></button>
          </div>
        </section>
        <section class="signs" id="computer-scissors">
          <h4>Scissors</h4>
          <div class="choice">
            <button><img src="images/scissors.png" alt="An image of a scissors" height="150" width="150"></button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- *** Footer content of the page *** -->
  <footer class="footer-content">
    <p>Copyright © The Odin Project 2024</p>
  </footer>
</body>

</html>
