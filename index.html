<!doctype html>

<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>TOP | Rock Paper Scissors</title>
  <!-- <script src="js/script.js" type="text/javascript"></script> -->
</head>

<body>
  <header class="header-title">
    <h1>Rock Paper Scissors</h1>
    <img src="images/rock-paper-scissors.png" alt="A logo of hand signs that shows 'Rock', 'Paper' and 'Scissors'."
      height="80" width="80">
  </header>

  <section class="scorecards">
    <h2>Score</h2>
    <div class="scores-individual">
      <section class="player-score">
        <h3>Player</h3>
        <div class="current-score"></div>
      </section>
      <section class="computer-score">
        <h3>Computer</h3>
        <div class="current-score"></div>
      </section>
    </div>
  </section>
</body>

</html>
